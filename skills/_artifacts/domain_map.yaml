tensions:
  - domains: [charts, tokens]
    description: >
      Chart color sourcing conflict. ChartRenderer uses hardcoded hex CHART_COLORS
      (approximations of token OKLCH values) while ChartContainer uses ChartConfig
      which can reference CSS vars (var(--chart-1)). Mixing the two systems in the
      same view produces colour inconsistency in dark mode, since CHART_COLORS
      are fixed hex but CSS vars change with .dark class.

