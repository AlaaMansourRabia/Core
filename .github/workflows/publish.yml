name: Publish Packages

# On push to main: publishes stable versions to npm
# Uses the version from package.json (no changesets required)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm --filter "@corensystem/coren-*" build

      - name: Publish tokens
        run: pnpm --filter @corensystem/coren-tokens publish --no-git-checks || echo "Already published or error"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish utils
        run: pnpm --filter @corensystem/coren-utils publish --no-git-checks || echo "Already published or error"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish components
        run: pnpm --filter @corensystem/coren-ui publish --no-git-checks || echo "Already published or error"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
